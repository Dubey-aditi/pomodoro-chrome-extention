<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bloom Focus</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="mini.css" />
  </head>
  <body>
    <div class="mini" id="mini" data-phase="focus">
      <div class="ring">
        <svg viewBox="0 0 50 50">
          <defs>
            <linearGradient id="mgrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" class="g1" />
              <stop offset="100%" class="g2" />
            </linearGradient>
          </defs>
          <circle cx="25" cy="25" r="21" class="track" />
          <circle cx="25" cy="25" r="21" class="prog" />
        </svg>
        <div class="dot">🌷</div>
      </div>
      <div class="info">
        <span class="phase">focus</span>
        <span class="time">25:00</span>
        <span class="today">today 0m</span>
      </div>
      <div class="btns">
        <button class="main" data-act="toggle" title="Start / pause"></button>
        <button data-act="reset" title="Reset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg></button>
        <button data-act="skip" title="Skip"><svg viewBox="0 0 24 24"><path d="M5 5l10 7-10 7V5Z" /><path d="M19 5v14" /></svg></button>
        <button data-act="music" title="Calm music"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></svg></button>
        <button data-act="pin" title="Keep on top of all windows"><svg viewBox="0 0 24 24"><path d="M12 17v5" /><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4-1-6Z" /></svg></button>
      </div>
    </div>
    <p class="note" id="note" hidden>floating on top ✿ close the floating window to bring it back here</p>
    <script type="module" src="mini.js"></script>
  </body>
</html>
