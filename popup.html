<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bloom Focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-phase="focus">
    <header>
      <div class="brand"><span class="blossom">✿</span> bloom</div>
      <button id="popout" class="icon-btn pill" title="Open mini timer you can keep on top" aria-label="Open mini timer">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" /><rect x="12" y="11" width="6" height="5" rx="1" /></svg>
        mini
      </button>
      <button id="gear" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
      </button>
    </header>

    <section id="settings" class="card settings" hidden>
      <div class="row">
        <span>Focus</span>
        <div class="stepper" data-key="focusMin" data-step="5" data-min="5" data-max="120">
          <button data-d="-1" aria-label="Less focus time">−</button><b id="focusMin">25</b><small>min</small><button data-d="1" aria-label="More focus time">+</button>
        </div>
      </div>
      <div class="row">
        <span>Break</span>
        <div class="stepper" data-key="breakMin" data-step="1" data-min="1" data-max="60">
          <button data-d="-1" aria-label="Less break time">−</button><b id="breakMin">5</b><small>min</small><button data-d="1" aria-label="More break time">+</button>
        </div>
      </div>
      <label class="row">
        <span>Auto-start next session</span>
        <input type="checkbox" id="autoStart" class="switch" />
      </label>
      <label class="row">
        <span>Floating timer on coding sites</span>
        <input type="checkbox" id="widgetOn" class="switch" />
      </label>
      <p class="hint">Shows on LeetCode, GeeksforGeeks, NeetCode &amp; Hello Interview.</p>
    </section>

    <nav class="tabs" role="tablist">
      <button data-phase="focus" role="tab">focus 🌷</button>
      <button data-phase="break" role="tab">break ☕</button>
    </nav>

    <section class="timer">
      <svg class="ring" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" class="g1" />
            <stop offset="100%" class="g2" />
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="88" class="track" />
        <circle cx="100" cy="100" r="88" class="progress" id="progress" />
      </svg>
      <div class="center">
        <div id="time" class="time">25:00</div>
        <div id="label" class="label">ready when you are</div>
      </div>
    </section>

    <div class="controls">
      <button id="reset" class="icon-btn round" title="Reset" aria-label="Reset">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
      </button>
      <button id="toggle" class="primary">start</button>
      <button id="skip" class="icon-btn round" title="Skip to next" aria-label="Skip">
        <svg viewBox="0 0 24 24"><path d="M5 5l10 7-10 7V5Z" /><path d="M19 5v14" /></svg>
      </button>
    </div>

    <section class="card stats">
      <div>
        <div class="eyebrow">today</div>
        <div id="today" class="big">0m</div>
        <div id="sessions" class="muted">0 sessions</div>
      </div>
      <div id="week" class="week" aria-label="Focus time, last 7 days"></div>
    </section>

    <section class="card music">
      <div class="row">
        <div class="eq" id="eq"><i></i><i></i><i></i><i></i></div>
        <div class="grow">
          <div class="title">calm lofi</div>
          <div class="muted">soft pads &amp; gentle keys</div>
        </div>
        <input type="checkbox" id="musicOn" class="switch" aria-label="Background music" />
      </div>
      <div class="row volume" id="volumeRow" hidden>
        <span class="muted">🔈</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" aria-label="Volume" />
        <span class="muted">🔊</span>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
